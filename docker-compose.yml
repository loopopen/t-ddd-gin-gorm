x-kafka-sasl-jaas: &kafka-sasl-jaas 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME-kafka}" password="${KAFKA_PASSWORD-kafka}" user_${KAFKA_USERNAME-kafka}="${KAFKA_PASSWORD-kafka}";'

services:
  go-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: debug
      args:
        COMMIT_SHA: ${COMMIT_SHA-dirty}
    container_name: ${ORG_NAME}-${APP_NAME}-debug
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV-internal}
      - APP_ORM_MYSQL_DSN=${APP_ORM_MYSQL_DSN}
      - APP_KAFKA_BROKERS=${APP_KAFKA_BROKERS}
    ports:
      - ${APP_PORT-8080}:8080
      - 40000:40000
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./cmd/api/etc:/app/etc
    networks:
      - debug-net

  mariadb:
    image: mariadb:11.8
    container_name: ${ORG_NAME}-${APP_NAME}-debug-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MARIADB_DATABASE: debug
    ports:
      - ${MYSQL_PORT-3306}:3306
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --host=localhost --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - debug-net

  kafka:
    image: apache/kafka:4.3.1
    container_name: ${ORG_NAME}-${APP_NAME}-debug-kafka
    ports:
      - "${KAFKA_PORT-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-sasl-jaas
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: *kafka-sasl-jaas
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-log:/var/log/kafka
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'security.protocol=SASL_PLAINTEXT\nsasl.mechanism=PLAIN\nsasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME-kafka}" password="${KAFKA_PASSWORD-kafka}";\n' > /tmp/healthcheck.properties
          && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /tmp/healthcheck.properties --list >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      debug-net:

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: ${ORG_NAME}-${APP_NAME}-debug-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - ${KAFKA_UI_PORT-8888}:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: *kafka-sasl-jaas
    volumes:
      - kafka-ui-config:/etc/kafkaui
    networks:
      debug-net:

volumes:
  mysqldata:
  kafka-data:
  kafka-log:
  kafka-ui-config:

networks:
  debug-net:

