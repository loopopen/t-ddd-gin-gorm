default:
  image: golang:1.27.1-alpine
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/gomod

variables:
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/gomod"

stages:
  - lint
  - test
  - package

.go-job:
  before_script:
    - apk add --no-cache make
    - go mod download

lint:
  stage: lint
  extends: .go-job
  script:
    - make lint

test:
  stage: test
  extends: .go-job
  script:
    - make test

build-and-push-image:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        BUILD_TARGET: "release"
        IMAGE_TAG: "$CI_COMMIT_TAG"
    - if: '$CI_COMMIT_BRANCH =~ /^debug\//'
      variables:
        BUILD_TARGET: "debug"
        IMAGE_TAG: "$CI_COMMIT_SHORT_SHA-debug"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        BUILD_TARGET: "release"
        IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    - when: never
  script:
    - mkdir -p /kaniko/.docker
    - >-
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}'
      "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD"
      > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/cache"
      --target "$BUILD_TARGET"
      --build-arg "COMMIT_SHA=$CI_COMMIT_SHORT_SHA"
